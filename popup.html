<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PopBlock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0d0f;
      --surface:  #161618;
      --border:   #2a2a2e;
      --accent:   #e63946;
      --accent2:  #ff6b6b;
      --green:    #06d6a0;
      --text:     #f0f0f0;
      --muted:    #777;
      --pill-bg:  #1e1e22;
    }

    body {
      width: 300px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 28px; height: 28px;
      background: var(--accent);
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-size: 14px;
      line-height: 1;
      flex-shrink: 0;
    }

    .logo-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .logo-name span { color: var(--accent); }

    /* Toggle switch */
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: color 0.2s;
    }

    .toggle-label.on { color: var(--green); }

    .toggle {
      position: relative;
      width: 38px;
      height: 20px;
      cursor: pointer;
    }

    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--border);
      border-radius: 20px;
      transition: background 0.25s;
    }

    .toggle input:checked ~ .toggle-track {
      background: var(--green);
    }

    .toggle-thumb {
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.25s cubic-bezier(.4,0,.2,1);
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    .toggle input:checked ~ .toggle-thumb {
      transform: translateX(18px);
    }

    /* Stats grid */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 14px 18px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      border-radius: 2px 2px 0 0;
      opacity: 0.7;
    }

    .stat-card.popups::before   { background: var(--accent); }
    .stat-card.redirects::before { background: #f4a261; }
    .stat-card.overlays::before { background: #a8dadc; }
    .stat-card.ads::before      { background: var(--green); }

    .stat-icon {
      font-size: 16px;
      margin-bottom: 6px;
      display: block;
    }

    .stat-num {
      font-family: 'Space Mono', monospace;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 2px;
    }

    .stat-card.popups   .stat-num { color: var(--accent2); }
    .stat-card.redirects .stat-num { color: #f4a261; }
    .stat-card.overlays .stat-num { color: #a8dadc; }
    .stat-card.ads      .stat-num { color: var(--green); }

    .stat-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.04em;
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
    }

    /* Total bar */
    .total-bar {
      margin: 0 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .total-text {
      font-size: 12px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .total-num {
      font-family: 'Space Mono', monospace;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    /* Site toggle */
    .site-row {
      margin: 10px 18px 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .site-row.disabled { opacity: 0.5; }

    .site-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .site-title {
      font-size: 10px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .site-host {
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toggle.small {
      width: 32px;
      height: 16px;
    }

    .toggle.small .toggle-thumb {
      width: 12px;
      height: 12px;
      top: 2px;
      left: 2px;
    }

    .toggle.small input:checked ~ .toggle-thumb {
      transform: translateX(14px);
    }

    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px 14px;
      margin-top: 10px;
      border-top: 1px solid var(--border);
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }

    .dot.active {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .clear-btn {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: color 0.15s, border-color 0.15s;
    }

    .clear-btn:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    /* Disabled state */
    body.disabled .stats,
    body.disabled .total-bar,
    body.disabled .site-row { opacity: 0.4; pointer-events: none; }

    body.disabled .logo-icon { background: var(--muted); }

    /* Animate numbers */
    .stat-num {
      transition: transform 0.2s, opacity 0.2s;
    }

    .bump {
      animation: bump 0.3s ease;
    }

    @keyframes bump {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <div class="logo-icon">🛡</div>
      <div class="logo-name">Pop<span>Block</span></div>
    </div>
    <div class="toggle-wrap">
      <span class="toggle-label" id="toggle-label">ON</span>
      <label class="toggle">
        <input type="checkbox" id="main-toggle" checked>
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card popups">
      <span class="stat-icon">💥</span>
      <div class="stat-num" id="stat-popups">0</div>
      <div class="stat-label">Popups</div>
    </div>
    <div class="stat-card redirects">
      <span class="stat-icon">↗</span>
      <div class="stat-num" id="stat-redirects">0</div>
      <div class="stat-label">Redirects</div>
    </div>
    <div class="stat-card overlays">
      <span class="stat-icon">◻</span>
      <div class="stat-num" id="stat-overlays">0</div>
      <div class="stat-label">Overlays</div>
    </div>
    <div class="stat-card ads">
      <span class="stat-icon">✕</span>
      <div class="stat-num" id="stat-ads">0</div>
      <div class="stat-label">Ad Reqs</div>
    </div>
  </div>

  <div class="total-bar">
    <span class="total-text">Total blocked</span>
    <span class="total-num" id="stat-total">0</span>
  </div>

  <div class="site-row" id="site-row">
    <div class="site-info">
      <div class="site-title">Pause on this site</div>
      <div class="site-host" id="site-host">Unavailable</div>
    </div>
    <label class="toggle small">
      <input type="checkbox" id="site-toggle">
      <div class="toggle-track"></div>
      <div class="toggle-thumb"></div>
    </label>
  </div>

  <div class="footer">
    <div class="status-dot">
      <div class="dot active" id="status-dot"></div>
      <span id="status-text">Active</span>
    </div>
    <button class="clear-btn" id="clear-btn">Clear</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
